services:
  postgres:
    image: postgres:16
    container_name: househack-postgres
    environment:
      POSTGRES_USER: househack
      POSTGRES_PASSWORD: househack
      POSTGRES_DB: househack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U househack"]
      interval: 5s
      retries: 10

  basic-server:
    image: househack
    container_name: househack-web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      PORT: 8888
      APP: /opt/applications/basic-server.jar
      DATABASE_URL: postgres://househack:househack@postgres:5432/househack
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}

  data-collector:
    image: househack
    container_name: househack-collector
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8886:8886"
    environment:
      PORT: 8886
      APP: /opt/applications/data-collector-server.jar
      DATABASE_URL: postgres://househack:househack@postgres:5432/househack
      RENTCAST_API_KEY: ${RENTCAST_API_KEY:-}

  data-analyzer:
    image: househack
    container_name: househack-analyzer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8887:8887"
    environment:
      PORT: 8887
      APP: /opt/applications/data-analyzer-server.jar
      DATABASE_URL: postgres://househack:househack@postgres:5432/househack
