<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" width="1500" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="HouseHack architecture: browser pages talk to a Ktor web app over HTTP; the web app reads and writes Postgres; a separate collector process pulls RentCast listings and Florida DOR parcel data daily into Postgres; a separate analyzer process polls Postgres, scores listings, writes analyses, and emails alerts; all run on Render with CI/CD from GitHub Actions.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="720" fill="#ffffff"/>
  <text x="40" y="36" font-size="22" font-weight="700" fill="#111">HouseHack — high-level architecture</text>
  <text x="40" y="58" font-size="13" fill="#444">Three separate processes (web app, data collector, data analyzer) share one PostgreSQL database. Front end talks only to the web app.</text>

  <!-- FRONT END -->
  <rect x="40" y="110" width="250" height="320" rx="8" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="134" font-size="12" font-weight="700" fill="#111" letter-spacing="1">FRONT END · browser</text>
  <rect x="60" y="150" width="210" height="64" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5"/>
  <text x="165" y="176" text-anchor="middle" font-weight="600" fill="#111">Profile form</text>
  <text x="165" y="196" text-anchor="middle" font-size="11" fill="#444">income · savings · credit · commute</text>
  <rect x="60" y="232" width="210" height="64" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5"/>
  <text x="165" y="258" text-anchor="middle" font-weight="600" fill="#111">Ranked report</text>
  <text x="165" y="278" text-anchor="middle" font-size="11.5" fill="#444">listings sorted by net monthly cost</text>
  <rect x="60" y="314" width="210" height="64" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5"/>
  <text x="165" y="340" text-anchor="middle" font-weight="600" fill="#111">Property detail</text>
  <text x="165" y="360" text-anchor="middle" font-size="11.5" fill="#444">buyer view · lender view · programs</text>

  <!-- WEB APP -->
  <rect x="370" y="110" width="250" height="320" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="495" y="140" text-anchor="middle" font-weight="700" fill="#111">basic-server</text>
  <text x="495" y="158" text-anchor="middle" font-size="11.5" fill="#444">Ktor web app · process 1</text>
  <line x1="390" y1="172" x2="600" y2="172" stroke="#999"/>
  <text x="390" y="198" fill="#111">Freemarker page templates</text>
  <text x="390" y="230" fill="#111">REST API (JSON)</text>
  <text x="404" y="248" font-size="11.5" fill="#444">GET/PUT /api/profile</text>
  <text x="404" y="264" font-size="11.5" fill="#444">GET /api/listings?sort=net_monthly_cost</text>
  <text x="404" y="280" font-size="11.5" fill="#444">GET /api/listings/{id}</text>
  <text x="390" y="312" fill="#111">Form validation</text>
  <text x="390" y="344" fill="#111">/health · JSON logs</text>
  <text x="390" y="376" fill="#111">Repository layer (JDBC)</text>

  <!-- BROWSER <-> WEB -->
  <line x1="290" y1="236" x2="368" y2="236" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="329" y="228" text-anchor="middle" font-size="11" fill="#111">HTTP GET / POST</text>
  <line x1="368" y1="300" x2="292" y2="300" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="329" y="318" text-anchor="middle" font-size="11" fill="#111">HTML pages</text>

  <!-- POSTGRES -->
  <path d="M 700 130 a 100 16 0 0 1 200 0 v 280 a 100 16 0 0 1 -200 0 z" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <ellipse cx="800" cy="130" rx="100" ry="16" fill="#f3f4f6" stroke="#111" stroke-width="2"/>
  <text x="800" y="176" text-anchor="middle" font-weight="700" fill="#111">PostgreSQL</text>
  <text x="800" y="194" text-anchor="middle" font-size="11.5" fill="#444">Render managed DB</text>
  <text x="800" y="230" text-anchor="middle" fill="#111">profiles</text>
  <text x="800" y="256" text-anchor="middle" fill="#111">listings (raw, per day)</text>
  <text x="800" y="282" text-anchor="middle" fill="#111">parcel_facts</text>
  <text x="800" y="308" text-anchor="middle" fill="#111">rent_estimates</text>
  <text x="800" y="334" text-anchor="middle" fill="#111">analyses</text>
  <text x="800" y="360" text-anchor="middle" fill="#111">alert_events</text>
  <text x="800" y="392" text-anchor="middle" font-size="11.5" fill="#444">program_rules (by year)</text>

  <!-- WEB <-> POSTGRES -->
  <line x1="620" y1="240" x2="698" y2="240" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="659" y="232" text-anchor="middle" font-size="11" fill="#111">writes profile</text>
  <line x1="698" y1="300" x2="622" y2="300" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="659" y="318" text-anchor="middle" font-size="11" fill="#111">reads analyses</text>

  <!-- COLLECTOR -->
  <rect x="980" y="70" width="250" height="150" rx="8" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <text x="1105" y="98" text-anchor="middle" font-weight="700" fill="#111">data-collector-server</text>
  <text x="1105" y="116" text-anchor="middle" font-size="11.5" fill="#444">background worker · process 2</text>
  <line x1="1000" y1="128" x2="1210" y2="128" stroke="#999"/>
  <text x="1000" y="150" font-size="12" fill="#111">one daily pipeline (WorkScheduler)</text>
  <text x="1000" y="170" font-size="12" fill="#111">fetches 2–4 unit sale listings</text>
  <text x="1000" y="190" font-size="12" fill="#111">rent estimate only for new listings</text>
  <text x="1000" y="210" font-size="12" fill="#111">links + sweeps county parcel records</text>

  <!-- ANALYZER (accent) -->
  <rect x="980" y="330" width="250" height="180" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1105" y="358" text-anchor="middle" font-weight="700" fill="#1d4ed8">data-analyzer-server</text>
  <text x="1105" y="376" text-anchor="middle" font-size="11.5" fill="#1e3a8a">background worker · process 3</text>
  <line x1="1000" y1="388" x2="1210" y2="388" stroke="#93c5fd"/>
  <text x="1000" y="410" font-size="12" fill="#111">joins listing + parcel + rent + profile</text>
  <text x="1000" y="430" font-size="12" fill="#111">buyer view: net monthly cost, cash to close</text>
  <text x="1000" y="450" font-size="12" fill="#111">lender view: FHA 75% rule, self-sufficiency</text>
  <text x="1000" y="470" font-size="12" fill="#111">program eligibility (HTH · HFA · SHIP · homestead)</text>
  <text x="1000" y="490" font-size="12" fill="#111">emits alert_event when a listing enters top 10</text>

  <!-- EXTERNAL -->
  <rect x="1300" y="60" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5"/>
  <text x="1385" y="85" text-anchor="middle" font-weight="600" fill="#111">RentCast API</text>
  <text x="1385" y="104" text-anchor="middle" font-size="11" fill="#444">listings · rent AVM · 50 req/mo</text>
  <rect x="1300" y="160" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5"/>
  <text x="1385" y="185" text-anchor="middle" font-weight="600" fill="#111">Florida DOR parcels</text>
  <text x="1385" y="204" text-anchor="middle" font-size="11" fill="#444">ArcGIS REST · units, values</text>
  <rect x="1300" y="430" width="170" height="60" rx="6" fill="#f3f4f6" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1385" y="455" text-anchor="middle" font-weight="600" fill="#111">Email (SMTP)</text>
  <text x="1385" y="474" text-anchor="middle" font-size="11" fill="#444">top-10 alert · A-level item</text>

  <!-- COLLECTOR -> EXTERNAL -->
  <line x1="1230" y1="100" x2="1298" y2="92" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1264" y="82" text-anchor="middle" font-size="11" fill="#111">GET, daily</text>
  <line x1="1230" y1="180" x2="1298" y2="188" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1264" y="206" text-anchor="middle" font-size="11" fill="#111">spatial query</text>

  <!-- COLLECTOR -> POSTGRES -->
  <line x1="980" y1="170" x2="902" y2="200" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="936" y="166" text-anchor="middle" font-size="11" fill="#111">writes listings,</text>
  <text x="936" y="180" text-anchor="middle" font-size="11" fill="#111">parcel_facts, rents</text>

  <!-- ANALYZER <-> POSTGRES -->
  <line x1="902" y1="350" x2="978" y2="380" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="936" y="344" text-anchor="middle" font-size="11" fill="#1d4ed8">polls for new</text>
  <text x="936" y="358" text-anchor="middle" font-size="11" fill="#1d4ed8">listings (60 s)</text>
  <line x1="978" y1="440" x2="900" y2="410" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="936" y="444" text-anchor="middle" font-size="11" fill="#1d4ed8">writes analyses,</text>
  <text x="936" y="458" text-anchor="middle" font-size="11" fill="#1d4ed8">alert_events</text>

  <!-- ANALYZER -> SMTP -->
  <line x1="1230" y1="460" x2="1298" y2="460" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="1264" y="452" text-anchor="middle" font-size="11" fill="#111">sends alert</text>

  <!-- NO direct arrow note -->
  <text x="1105" y="262" text-anchor="middle" font-size="11.5" fill="#444" font-style="italic">Collector and analyzer never call each other;</text>
  <text x="1105" y="278" text-anchor="middle" font-size="11.5" fill="#444" font-style="italic">they collaborate only through the database.</text>

  <!-- PRODUCTION BAND -->
  <rect x="40" y="560" width="1430" height="130" rx="8" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="56" y="584" font-size="12" font-weight="700" fill="#111" letter-spacing="1">PRODUCTION ENVIRONMENT · Render</text>
  <text x="56" y="610" font-size="12.5" fill="#111">Free tier: one web service runs basic-server and both schedulers in-process (RUN_WORKERS=collector,analyzer) + managed PostgreSQL. Locally the three run as separate processes.</text>
  <text x="56" y="634" font-size="12.5" fill="#111">Monitoring: every process serves GET /health (DB status, active and pending listings); Render shows logs, request rate, and errors.</text>
  <text x="56" y="658" font-size="12.5" fill="#111">CI/CD: GitHub Actions runs unit + integration tests against Postgres on every push; Render auto-deploys main (continuous delivery is an A-level item).</text>
  <text x="56" y="680" font-size="11.5" fill="#444">Secrets (RENTCAST_API_KEY, DATABASE_URL, SMTP_URL) live only in Render environment variables.</text>
</svg>
